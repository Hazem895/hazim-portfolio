name: Deploy portfolio themes to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Portfolio theme updated"]
    types: [completed]
    branches: [luxurious-version, midnight-blue, emerald-green, royal-purple, burgundy-rose, slate-silver, carbon-red, electric-amethyst, system-core]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source-main
      - uses: actions/checkout@v4
        with:
          ref: luxurious-version
          path: source-luxurious-version
      - uses: actions/checkout@v4
        with:
          ref: midnight-blue
          path: source-midnight-blue
      - uses: actions/checkout@v4
        with:
          ref: emerald-green
          path: source-emerald-green
      - uses: actions/checkout@v4
        with:
          ref: royal-purple
          path: source-royal-purple
      - uses: actions/checkout@v4
        with:
          ref: burgundy-rose
          path: source-burgundy-rose
      - uses: actions/checkout@v4
        with:
          ref: slate-silver
          path: source-slate-silver
      - uses: actions/checkout@v4
        with:
          ref: carbon-red
          path: source-carbon-red
      - uses: actions/checkout@v4
        with:
          ref: electric-amethyst
          path: source-electric-amethyst
      - uses: actions/checkout@v4
        with:
          ref: system-core
          path: source-system-core
      - name: Assemble each branch at its own URL
        shell: bash
        run: |
          mkdir -p public
          cp source-main/*.html source-main/*.pdf public/
          for theme in luxurious-version midnight-blue emerald-green royal-purple burgundy-rose slate-silver carbon-red electric-amethyst system-core; do
            mkdir -p "public/$theme"
            cp "source-$theme/"*.html "source-$theme/"*.pdf "public/$theme/"
          done
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
