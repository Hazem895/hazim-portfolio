name: Deploy portfolio themes to GitHub Pages
on:
  push:
    branches: [main, luxury, system-core, play]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the three portfolio versions
        run: |
          mkdir -p public/luxury public/system-core public/play
          cp index.html *.pdf public/
          cp luxury/index.html public/luxury/
          cp system-core/index.html public/system-core/
          cp play/index.html public/play/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
